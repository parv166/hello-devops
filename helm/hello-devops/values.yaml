replicaCount: 2

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 60

imagePullSecrets:
  - name: ghcr-secret

image:
  repository: ghcr.io/parv166/hello-devops
  tag: "8df0ba540e310914f04a4ed4db3576050f5230c9"
  pullPolicy: IfNotPresent

config:
  appEnv: kubernetes
  appTagline: "GitOps deployment managed by Argo CD"

secret:
  existingName: hello-devops-secret

service:
  type: NodePort
  port: 80
  targetPort: http
  nodePort: 30080

ingress:
  enabled: true
  className: traefik
  host: hello.local
  path: /

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
