
name: Hello DevOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  build-test-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      # Helm validation
      - name: Render and validate Helm templates
        run: |
          set -e

          echo "Testing default configuration (autoscaling disabled)..."

          helm template hello-devops ./helm/hello-devops \
            --namespace hello-devops \
            > /tmp/hello-devops-rendered.yaml

          for resource in Deployment Service ConfigMap Ingress; do
            if ! grep -q "^kind: ${resource}$" /tmp/hello-devops-rendered.yaml; then
              echo "ERROR: Missing rendered resource: ${resource}"
              exit 1
            fi
            echo "Validated: ${resource}"
          done

          if grep -q "^kind: HorizontalPodAutoscaler$" /tmp/hello-devops-rendered.yaml; then
            echo "ERROR: HPA should be disabled by default"
            exit 1
          fi

          echo "Validated: HPA disabled by default"

          echo "Testing autoscaling enabled configuration..."

          helm template hello-devops ./helm/hello-devops \
            --namespace hello-devops \
            --set autoscaling.enabled=true \
            > /tmp/hello-devops-hpa-rendered.yaml

          if ! grep -q "^kind: HorizontalPodAutoscaler$" /tmp/hello-devops-hpa-rendered.yaml; then
            echo "ERROR: HPA missing when autoscaling is enabled"
            exit 1
          fi

          echo "Validated: HPA enabled when requested"

      # Docker build and application test
      - name: Build Docker image
        run: docker build -t local/hello-devops:${GITHUB_SHA} .

      - name: Start application
        run: |
          docker run -d \
            --name hello-devops-test \
            -p 5000:5000 \
            local/hello-devops:${GITHUB_SHA}

      - name: Test application health
        run: |
          for i in {1..20}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo
              exit 0
            fi
            sleep 2
          done

          docker logs hello-devops-test
          exit 1

      # Security scanning
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/hello-devops:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

      # Publish only after tests and security scanning pass
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Tag image for GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"

          docker tag local/hello-devops:${GITHUB_SHA} \
            "${IMAGE_NAME}:${GITHUB_SHA}"

          docker tag local/hello-devops:${GITHUB_SHA} \
            "${IMAGE_NAME}:latest"

      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_NAME="ghcr.io/${GITHUB_REPOSITORY,,}"

          docker push "${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${IMAGE_NAME}:latest"

      # Update Helm values to trigger Argo CD deployment
      - name: Update Helm image tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE_TAG="${GITHUB_SHA}"

          sed -i "s/tag: \".*\"/tag: \"${IMAGE_TAG}\"/" \
            helm/hello-devops/values.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/hello-devops/values.yaml

          if git diff --cached --quiet; then
            echo "No Helm image tag changes."
            exit 0
          fi

          git commit -m "chore(gitops): deploy image ${IMAGE_TAG} [skip ci]"
          git push origin HEAD:main
